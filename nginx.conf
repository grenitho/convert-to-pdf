# =====================================================
# Template Konfigurasi Nginx untuk Convert-to-PDF App
# =====================================================
# CARA PAKAI DI VPS:
# 1. Copy file ini ke /etc/nginx/sites-available/convert-to-pdf
# 2. Buat symlink: sudo ln -s /etc/nginx/sites-available/convert-to-pdf /etc/nginx/sites-enabled/
# 3. Generate basic auth: sudo htpasswd -c /etc/nginx/.htpasswd namauser
# 4. Test config: sudo nginx -t
# 5. Reload: sudo systemctl reload nginx
# 6. Setup SSL: sudo certbot --nginx -d convert.domainkamu.com
# =====================================================

# Rate limiting zone - mencegah abuse
# 10 request per detik per IP, dengan burst 20 request
limit_req_zone $binary_remote_addr zone=convert_limit:10m rate=10r/s;

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name convert.domainkamu.com; # GANTI dengan domain kamu
    
    # Redirect semua traffic ke HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    server_name convert.domainkamu.com; # GANTI dengan domain kamu
    
    # SSL Configuration (akan di-generate otomatis oleh Certbot)
    # ssl_certificate /etc/letsencrypt/live/convert.domainkamu.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/convert.domainkamu.com/privkey.pem;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Batas ukuran upload (beri ruang lebih dari MAX_FILE_SIZE di .env)
    # .env kita set 25MB, jadi kita kasih 30MB di sini
    client_max_body_size 30M;
    
    # Timeout untuk request (lebih lama dari conversion timeout 120s)
    proxy_read_timeout 150s;
    proxy_connect_timeout 150s;
    proxy_send_timeout 150s;
    
    # Block akses langsung ke folder tmp (keamanan)
    location ~* ^/tmp/ {
        deny all;
        return 404;
    }
    
    # Main location - proxy ke Node.js backend
    location / {
        # Rate limiting
        limit_req zone=convert_limit burst=20 nodelay;
        
        # Basic Authentication
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        # Proxy ke Node.js backend (localhost:3000)
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Headers untuk proxy
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Buffer settings (optimasi untuk file upload besar)
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # Health check endpoint - tanpa basic auth (untuk monitoring)
    location /api/health {
        # Tidak ada basic auth, bisa diakses publik untuk monitoring
        # Tapi tetap dibatasi rate limiting
        limit_req zone=convert_limit burst=5 nodelay;
        
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Block akses ke file sensitif
    location ~ /\.(env|git) {
        deny all;
        return 404;
    }
    
    # Block akses ke file konfigurasi
    location ~* \.(json|log)$ {
        deny all;
        return 404;
    }
    
    # Logging
    access_log /var/log/nginx/convert-to-pdf.access.log;
    error_log /var/log/nginx/convert-to-pdf.error.log;
}