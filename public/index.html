<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert to PDF</title>
    <link rel="stylesheet" href="style.css">
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">

    <!-- iOS Safari Support -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ConvertPDF">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>

<body>
    <div id="offlineIndicator" class="offline-indicator">
        ⚠️ You are offline. Some features may not be available.
    </div>
    <main class="container">
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle Dark Mode">🌙</button>
        <header>
            <h1>Convert to PDF</h1>
            <p>Convert Office Files and Images to PDF privately and securely.</p>
        </header>

        <section class="upload-section">
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="input-group">
                    <!-- Accept attribute dibatasi hanya untuk ekstensi yang kita izini di backend -->
                    <input type="file" id="fileInput" name="file"
                        accept=".doc,.docx,.odt,.rtf,.txt,.xls,.xlsx,.ods,.csv,.ppt,.pptx,.odp,.jpg,.jpeg,.png,.bmp,.gif"
                        required>
                    <label for="fileInput" id="fileLabel">
                        <span id="fileText">Choose File (Max 40MB)</span>
                        <span class="drag-hint">or drag & drop file here</span>
                    </label>

                    <!-- File Preview Container -->
                    <div id="filePreview" class="file-preview">
                        <div class="file-preview-header">
                            <span class="file-preview-title">File Selected</span>
                            <button type="button" id="removeFileBtn" class="file-preview-remove"
                                aria-label="Remove file">×</button>
                        </div>
                        <div class="file-preview-details">
                            <span id="previewName" class="file-preview-name"></span>
                            <div class="file-preview-meta">
                                <span class="file-preview-meta-item">
                                    <span>📄</span>
                                    <span id="previewType"></span>
                                </span>
                                <span class="file-preview-meta-item">
                                    <span>💾</span>
                                    <span id="previewSize"></span>
                                </span>
                            </div>
                        </div>
                        <!-- Image preview (hanya muncul untuk file gambar) -->
                        <img id="previewImage" class="file-preview-image" style="display: none;" alt="Preview">
                    </div>
                </div>

                <button type="submit" id="submitBtn" disabled>
                    <span id="btnText">Convert to PDF</span>
                    <span id="loadingSpinner" class="spinner" style="display: none;"></span>
                </button>
            </form>
        </section>

        <section id="messageArea" class="message-area" style="display: none;">
            <p id="messageText"></p>
        </section>

        <section class="history-section">
            <button id="historyToggle" class="history-toggle">
                <span class="history-toggle-icon">▶</span>
                <span>Convert History</span>
            </button>
            <div id="historyContent" class="history-content">
                <ul id="historyList" class="history-list"></ul>
                <button id="clearHistoryBtn" class="history-clear-btn">Clear History</button>
            </div>
        </section>

        <footer class="footer-credit">
            <p>made by grenitho &mdash; 2026</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
